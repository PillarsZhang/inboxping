services:
  inboxping:
    build: .
    image: inboxping:latest
    # 与宿主机共享配置和 SQLite 文件，避免容器生成裸机用户无法维护的数据。
    user: "${INBOXPING_UID:-1000}:${INBOXPING_GID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    init: true
