services:
  inboxping:
    build: .
    image: inboxping:latest
    # rootless Docker 下不要指定 user：容器 UID 0 会映射为宿主机当前普通用户，
    # 可直接读写 ./data。如改用 rootful Docker，可按宿主机账户启用下面一行：
    # user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    init: true
