[project]
name = "inboxping"
version = "0.1.0"
description = "Lightweight real-time email analysis and WeCom notification service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "imapclient>=3.0,<4",
  "jinja2>=3.1,<4",
  "loguru>=0.7,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
inboxping = "inboxping.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inboxping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
